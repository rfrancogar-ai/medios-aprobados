<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Motor">
<script>
// iPhone: sin esto el audio del video sale por la bocina de llamadas (arriba). Así sale por la bocina normal.
try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}
// Acceso de la app instalada: la llave de ESTE dispositivo viaja en la dirección (?k=). Al "Agregar a pantalla de
// inicio", el iPhone guarda esa dirección, así que la app instalada entra sola, sin pedir llave nunca.
(function(){var m=location.search.match(/[?&]k=([^&#]+)/)||location.hash.match(/k=([^&]+)/),k=null;
try{if(m){k=decodeURIComponent(m[1]);localStorage.setItem("key",k);}else{k=localStorage.getItem("key");}}catch(e){}
document.write(k&&k.indexOf("d.")===0?'<link rel="manifest" href="/api/manifest?k='+encodeURIComponent(k)+'">':'<link rel="manifest" href="manifest.webmanifest">');})();
</script>

<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#141417;--mut:#6d6c75;--line:#e6e3dc;--soft:#efede7;--acc:#b8860b;--acc2:#fff6dc;--ok:#13804a;--okbg:#e6f4ec;--warn:#a96400;--warnbg:#fff3df;--bad:#c62828;--nav:rgba(245,244,240,.9)}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f12;--card:#19191e;--ink:#eeeef2;--mut:#9b9aa6;--line:#2a2a31;--soft:#222228;--acc:#e0b13a;--acc2:#2c2617;--okbg:#14291d;--warnbg:#2d2312;--nav:rgba(15,15,18,.9)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em}
#status{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}#status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}#status.off:before{background:var(--warn)}
main{padding:6px 16px calc(92px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
section{display:none}section.on{display:block;animation:in .18s ease}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav button.on{color:var(--acc);font-weight:700}nav svg{width:24px;height:24px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px;min-width:18px}
.badge[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.hero{background:linear-gradient(135deg,var(--acc2),var(--card));border-color:transparent}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:13px;margin:22px 4px 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
h3{font-size:17px;margin:0 0 4px;line-height:1.3}
p{margin:6px 0}.mut{color:var(--mut)}.small{font-size:14px}.tiny{font-size:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);width:100%}
.btn.go{background:var(--ok);color:#fff}.btn.ghost{background:var(--soft);color:var(--ink)}.btn.no{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;width:auto;border-radius:10px}.btn:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;font-size:14px;font-weight:600;background:var(--soft);margin:0 6px 6px 0;border:1px solid transparent;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--acc2);border-color:var(--acc)}.chip.x:after{content:"×";margin-left:4px;color:var(--mut)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--soft);margin:0 4px 4px 0}
.tag.ok{background:var(--okbg)}.tag.warn{background:var(--warnbg)}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--soft);font-size:12px;font-weight:800;flex:none}
.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
video{width:100%;max-height:70vh;aspect-ratio:9/16;border-radius:14px;background:#000;object-fit:contain;display:block}
.why{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut);font-size:14px;font-weight:600}
pre{white-space:pre-wrap;font:14px/1.5 inherit;margin:6px 0 0}
input{width:100%;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=date]{width:auto;flex:1;min-width:0}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}.seg .chip{flex:none}
.step{display:flex;gap:12px;padding:10px 0}.step b.n{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none;font-size:14px}
.beat{border-left:3px solid var(--acc);padding:2px 0 2px 12px;margin:10px 0}.beat .t{font-size:12px;color:var(--mut);font-weight:700}
.empty{color:var(--mut);text-align:center;padding:40px 16px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;z-index:9;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;max-width:560px;margin:0 auto}
#toast.on{opacity:1;transform:none}
#tp{position:fixed;inset:0;background:#000;color:#fff;z-index:20;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 60px) 22px 120px;font-size:30px;line-height:1.4;font-weight:600;display:none}
#tp.on{display:block}#tp .t{color:#e0b13a;font-size:16px;margin-top:28px}#tp .close{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:14px;background:#333;color:#fff;border:0;border-radius:99px;padding:8px 14px;font-size:15px}
/* Flujo: mapa vivo del motor */
.fl-node{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0;position:relative;opacity:0;transform:translateY(8px);animation:flin .5s ease forwards}
.fl-node h3{margin:0 0 2px;font-size:16px}.fl-node .k{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.fl-step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:800;margin-right:8px;vertical-align:-4px}
.fl-wire{display:block;margin:0 auto}.fl-wire path{stroke:var(--acc);stroke-width:2.5;fill:none;stroke-dasharray:3 7;stroke-linecap:round;animation:flow 1s linear infinite}
.fl-wire circle{fill:var(--acc)}
.fl-src{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.fl-src>div{background:var(--soft);border-radius:12px;padding:10px}
.fl-src b{display:block;font-size:20px}.fl-bars{display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:10px}
.fl-bars i{flex:1;background:var(--acc);border-radius:5px 5px 2px 2px;min-height:3px;transform-origin:bottom;animation:grow .7s ease both}
.fl-ok{color:var(--ok);font-weight:800}.fl-no{color:var(--warn);font-weight:800}
@keyframes flow{to{stroke-dashoffset:-20}}@keyframes flin{to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.fl-wire path,.fl-node,.fl-bars i{animation:none;opacity:1;transform:none}}
a{color:var(--acc)}
.thumb.foto{aspect-ratio:4/5}
.thumb{width:92px;flex:none;aspect-ratio:9/16;border-radius:10px;background:var(--soft);position:relative;overflow:hidden;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:auto 6px 6px auto;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:10px}
.strip img{height:170px;aspect-ratio:4/5;object-fit:cover;border-radius:10px;flex:none;scroll-snap-align:start;background:var(--soft);cursor:pointer}
</style>
</head>
<body>
<header><h1 id="ttl">Motor</h1><span id="status">…</span></header>
<main>
  <section id="login"><div class="card hero"><h3>Entrar</h3>
    <p class="small mut">Abre el link que te llegó por correo, o pega aquí la llave de ese correo.</p>
    <input id="keyin" type="password" autocomplete="off" placeholder="Llave de acceso">
    <div style="margin-top:10px"><button class="btn" onclick="saveKey()">Entrar</button></div></div></section>
  <section id="inicio"></section><section id="aprobar"></section><section id="grabar"></section>
  <section id="flujo"></section><section id="archivo"></section><section id="mas"></section>
</main>
<div id="toast"></div>
<div id="tp"><button class="close" onclick="tp(false)">Cerrar</button><div id="tpbody"></div></div>
<nav id="nav" hidden>
  <button data-t="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-t="aprobar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 7v5l3 2"/></svg>Programado<span class="badge" id="bdg" hidden></span></button>
  <button data-t="grabar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>Grabar</button>
  <button data-t="flujo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="2.4"/><circle cx="19" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M7 7.5 10.5 16M17 7.5 13.5 16M7.4 6h9.2"/></svg>Flujo</button>
  <button data-t="archivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Archivo</button>
  <button data-t="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Más</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?"–":Number(n).toLocaleString("es-MX",{maximumFractionDigits:1});
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const NET={tiktok:["TT","TikTok"],instagram:["IG","Instagram"],youtube:["YT","YouTube"],facebook:["FB","Facebook"]};
const netOf=id=>({tt:"tiktok",ig:"instagram",yt:"youtube",fb:"facebook"})[String(id).split(":")[0]]||"";
const TITLES={inicio:"Hoy",aprobar:"Programado",grabar:"Grabar",flujo:"Flujo del motor",archivo:"Tu archivo",mas:"Más"};
let API=null,G=null,PR=null;

// Acceso por link (#k=…): se guarda en el dispositivo. En Safari (no instalada) el link se conserva para que
// "Agregar a pantalla de inicio" lleve el acceso a la app instalada (iPhone no comparte sesión entre ambas).
(function(){const m=location.search.match(/[?&]k=([^&#]+)/)||location.hash.match(/k=([^&]+)/);if(m)store.set("key",decodeURIComponent(m[1]));})();
// La dirección de la Mac vive en GitHub (gratis): la app llama DIRECTO a la Mac, sin pasar por Netlify (27-nov).
const DIRECCION="https://api.github.com/repos/rfrancogar-ai/medios-aprobados/contents/tunel.json?ref=main";
async function loadConfig(){
  try{const r=await fetch(DIRECCION+"&t="+Date.now(),{cache:"no-store"});const j=JSON.parse(atob((await r.json()).content.replace(/\s/g,"")));
    if(j.api){API=j.api;store.set("api",API);return;}}catch(e){}
  try{const r=await fetch("config.json?t="+Date.now(),{cache:"no-store"});API=(await r.json()).api;store.set("api",API);}catch(e){API=store.get("api")||"";}}
async function call(path,opts={}){
  const key=store.get("key");if(!key)throw {status:401};
  const hdr={...opts,headers:{"Authorization":"Bearer "+key,"Content-Type":"application/json"}};
  let r;try{r=await fetch(API+path,hdr);}catch(e){await loadConfig();r=await fetch(API+path,hdr);}  // la Mac cambió de dirección
  if(r.status===401){store.del("key");show("login");throw {status:401};}
  if(!r.ok)throw {status:r.status};
  const d=await r.json();if(!opts.method)store.set("cache:"+path,JSON.stringify(d));return d;
}
async function getData(path){
  try{const d=await call(path);setStatus(true);return d;}
  catch(e){if(e.status===401)throw e;setStatus(false);const c=store.get("cache:"+path);if(c)return JSON.parse(c);throw e;}
}
function setStatus(on){const s=$("#status");s.textContent=on?"Mac conectada":"Mac sin conexión";s.className=on?"":"off";}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2800);}
function saveKey(){const v=$("#keyin").value.trim();if(!v)return;store.set("key",v);boot();}
function show(id){document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===id));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===id));
  $("#nav").hidden=id==="login";$("#ttl").textContent=TITLES[id]||"Motor";if(id!=="login")store.set("tab",id);scrollTo(0,0);}
function go(t){show(t);VIEWS[t]().catch(()=>{});}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.t);};
const when=iso=>{if(!iso)return"";const d=new Date(iso.slice(0,19)+"-06:00");return d.toLocaleString("es-MX",{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit",timeZone:"America/Mexico_City"});};
const ico=n=>`<div class="ico">${(NET[n]||["·"])[0]}</div>`;
function badge(n){const b=$("#bdg");b.hidden=!n;b.textContent=n||"";}
const PROG={"TikTok Creator Rewards":["TikTok te paga por vistas","Vistas en 30 días (videos de más de 1 min)","views_30d"],
 "IG (sin pago por vistas)":["Instagram: suscripciones y regalos","Seguidores","followers"],
 "TikTok Shop afiliados (EPIC/GetFit en vitrina)":["TikTok Shop: comisión por venta",null,null],
 "YPP nivel 1 (fan funding/Shopping)":["YouTube: primeros ingresos","Suscriptores","followers"],
 "YPP completo (anuncios)":["YouTube: anuncios en Shorts","Suscriptores","followers"],
 "Meta Content Monetization":["Facebook: pago por contenido","Seguidores","followers"]};

const VIEWS={
async inicio(){
  const el=$("#inicio");let d;try{d=await getData("/api/home");}catch(e){el.innerHTML='<div class="empty">Sin datos todavía. ¿Está encendida la Mac?</div>';return;}
  badge(d.waiting);const a=d.archive||{},g=d.guiones||{};
  const total=Object.entries(a).filter(([k])=>k!=="transcritos").reduce((s,[,v])=>s+v,0);
  const usable=total-(a.excluded||0)-(a.private||0),revisados=(a.segmented||0)+(a.broll||0);
  const money=(d.money||[]).filter(m=>PROG[m.program]&&!["YPP completo (anuncios)","Meta Content Monetization"].includes(m.program)).map(m=>{
    const [name,label,key]=PROG[m.program];const cur=JSON.parse(m.current_json||"{}"),req=JSON.parse(m.requirements_json||"{}");
    if(!key)return `<div class="item">${ico("tiktok")}<div class="grow"><b class="small">${name}</b><div class="small ok">Ya calificas. Etiqueta el producto EPIC en los videos donde lo mencionas.</div></div></div>`;
    const c=cur[key]||0,r=req[key]||1,pct=Math.min(100,100*c/r);
    return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:8px"><b class="small">${name}</b><span class="tiny ${pct>=100?"ok":"mut"}">${pct>=100?"listo":Math.round(pct)+"%"}</span></div>
      <div class="bar"><i style="width:${Math.max(pct,2)}%"></i></div><div class="tiny mut">${label}: ${fmt(c)} de ${fmt(r)}</div></div>`}).join("");
  const rv=d.reserva||{};
  el.innerHTML=`
  ${rv.por_dia?`<div class="card"><b>Reserva de contenido: ${rv.dias_listos} días</b><div class="tiny mut">${rv.reels_programados} reels programados · ${rv.esperando_ok} esperando tu OK · ${rv.tramos_candidatos} tramos para el editor · ${rv.horas_sin_transcribir} h de video por transcribir · meta ${rv.por_dia}/día</div>${rv.alerta?`<div class="small" style="color:#f5c442;margin-top:6px">⚠️ Reserva ${rv.alerta}</div>`:""}</div>`:""}
  ${d.waiting?`<div class="card hero"><div class="big">${d.waiting}</div><p>video${d.waiting>1?"s":""} con un dato de salud por revisar. Tú decides si salen.</p><button class="btn" onclick="go('aprobar')">Revisar ahora</button></div>`
   :`<div class="card hero"><h3>Todo al día ✓</h3><p class="small mut">No hay videos esperando. El editor propone nuevos a las 7:00 y 19:00.</p></div>`}
  ${(d.trials||[]).length?`<h2>Versión B para Trial Reels</h2><div class="card"><p class="small mut" style="margin-top:0">Ábrelo, toca Compartir → Guardar video, y súbelo en Instagram (o Edits) como <b>Trial Reel</b>.</p>${d.trials.map(t=>`<div class="item"><div class="ico">B</div><div class="grow"><div class="ell"><b>${esc(t.title||"")}</b></div></div><a class="btn sm" href="${API}${t.url}" target="_blank" rel="noopener">Abrir</a></div>`).join("")}</div>`:""}
  <h2>Próximas publicaciones</h2><div class="card">${(d.next||[]).map(n=>`<div class="item">${ico(n.platform)}<div class="grow"><div class="ell"><b>${esc(n.title)}</b></div><div class="tiny mut">${(NET[n.platform]||["",""])[1]} · ${when(n.scheduled_for)}</div></div></div>`).join("")||'<p class="small mut">Nada programado. Aprueba videos para llenar la agenda.</p>'}</div>
  ${(d.published||[]).length?`<h2>Ya publicado</h2><div class="card">${d.published.map(p=>/^https?:/.test(p.url||"")?`<a class="item" style="text-decoration:none;color:inherit" href="${esc(p.url)}" target="_blank" rel="noopener">${ico(p.platform)}<div class="grow"><div class="ell"><b>${esc(p.title)}</b></div><div class="tiny mut">${(NET[p.platform]||["",""])[1]} · ver publicación ↗</div></div></a>`
   :`<div class="item">${ico(p.platform)}<div class="grow"><div class="ell"><b>${esc(p.title)}</b></div><div class="tiny mut">${(NET[p.platform]||["",""])[1]} · publicado vía Metricool</div></div></div>`).join("")}</div>`:""}
  <h2>Camino a que te paguen</h2><div class="card">${money||'<p class="small mut">Calculando…</p>'}
   <p class="tiny mut" style="margin-top:10px">Meta #1: TikTok. Ya tienes los seguidores; faltan vistas en videos de más de 1 minuto. Por eso los guiones duran 65–85 s.</p></div>
  <h2>Grabar</h2><div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="grow"><b>${g.open||0} guiones listos</b><div class="small mut">${g.recorded||0} grabados. Graba 4 por sesión, 2 veces por semana.</div></div><button class="btn sm" onclick="go('grabar')">Ver</button></div></div>
  <h2>Tu archivo de iPhone</h2><div class="card"><div class="small">${fmt(usable)} videos tuyos en iCloud · <b>${fmt(revisados)}</b> ya revisados por el editor</div>
   <div class="bar"><i style="width:${Math.max(2,100*revisados/Math.max(usable,1))}%"></i></div>

  el.innerHTML=`<div class="card hero"><h3>¿Qué uso primero?</h3><p class="small">Tienes miles de videos. Dime qué es importante y el editor lo revisa antes que todo lo demás.</p></div>
   <h2>1 · Álbumes de Fotos</h2><div class="card"><p class="small mut" style="margin-top:0">Toca los álbumes prioritarios. Truco: en Fotos crea un álbum llamado <b>MOTOR</b> y mete ahí lo que quieras que salga pronto (se detecta en la siguiente revisión, cada 12 h).</p>
    <div id="albs">${names.map(n=>{const c=(al.find(a=>a.album===n)||{}).n;return `<span class="chip ${pr.albums.includes(n)?"on":""}" data-a="${esc(n)}">${esc(n.trim()||"(sin nombre)")}${c?` <span class="mut tiny">${c}</span>`:""}</span>`}).join("")}</div></div>
   <h2>2 · Fechas importantes</h2><div class="card"><p class="small mut" style="margin-top:0">Ej. la inauguración, un evento, una semana de grabación.</p>
    <div id="dr">${pr.date_ranges.map((r,i)=>`<span class="chip x" data-i="${i}">${esc(r.label||"")} ${esc(r.from)} → ${esc(r.to)}</span>`).join("")||'<span class="small mut">Ninguna todavía.</span>'}</div>
    <div style="display:flex;gap:6px;margin-top:10px"><input type="date" id="df" aria-label="Desde"><input type="date" id="dt" aria-label="Hasta"></div>
    <input id="dl" placeholder="Nombre (opcional), ej. Inauguración" style="margin-top:6px"><div style="margin-top:8px"><button class="btn ghost sm" onclick="addRange()">+ Agregar fechas</button></div></div>
   <h2>3 · Palabras clave</h2><div class="card"><p class="small mut" style="margin-top:0">Temas que quieres primero (se buscan en la descripción que hace Fotos de cada video).</p>
    <div id="kw">${pr.keywords.map((k,i)=>`<span class="chip x" data-k="${i}">${esc(k)}</span>`).join("")}</div>
    <div style="display:flex;gap:6px;margin-top:8px"><input id="kwi" placeholder="ej. gimnasio, fábrica, atleta"><button class="btn ghost sm" onclick="addKw()">+</button></div></div>
   <button class="btn" style="margin-top:4px" onclick="savePr(this)">Guardar prioridades</button>
   <h2>Siguientes en la fila</h2><div class="card">${(p.next_up||[]).map(n=>`<div class="item"><div class="ico">${esc((n.date||"").slice(5,10).split("-").reverse().join("/"))}</div><div class="grow"><div class="small ell">${esc(n.caption||"Video sin descripción")}</div><div class="tiny mut">${n.date?esc(n.date.slice(0,4))+" · ":""}${n.dur?Math.round(n.dur/6)/10+" min":""}</div></div></div>`).join("")||'<p class="small mut">—</p>'}</div>`;
  $("#albs").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const a=c.dataset.a,i=PR.albums.indexOf(a);i<0?PR.albums.push(a):PR.albums.splice(i,1);c.classList.toggle("on");};
  $("#dr").onclick=e=>{const c=e.target.closest(".chip");if(c){PR.date_ranges.splice(+c.dataset.i,1);savePr();}};
  $("#kw").onclick=e=>{const c=e.target.closest(".chip");if(c){PR.keywords.splice(+c.dataset.k,1);savePr();}};},

};

// Lo aprobado/rechazado se oculta al instante y no vuelve (aunque la lista llegue de caché o tarde la Mac)
function hidden(){try{const h=JSON.parse(store.get("hidden")||"{}"),now=Date.now();
  for(const k in h)if(now-h[k]>36*3600e3)delete h[k];return h;}catch(e){return {};}}
function pending_acts(n,a){try{const q=JSON.parse(store.get("pend")||"[]");q.push([n,a]);store.set("pend",JSON.stringify(q));}catch(e){}}
async function flush_acts(){let q=[];try{q=JSON.parse(store.get("pend")||"[]");}catch(e){}
  const left=[];for(const [n,a] of q){try{await call(`/api/issue/${n}/${a}`,{method:"POST"});}catch(e){left.push([n,a]);}}
  store.set("pend",JSON.stringify(left));}
function hide(keys){const h=hidden();keys.forEach(k=>{if(k)h[k]=Date.now();});store.set("hidden",JSON.stringify(h));}
async function act(btn,n,a){
  if(a==="approve_claims"&&!confirm("Este video tiene un dato sin fuente en la biblioteca. ¿Lo revisaste y estás seguro?"))return;
  if(a==="reject"&&!confirm("¿Descartar este video?"))return;
  btn.disabled=true;
  const c=btn.closest(".card");const clip=c&&c.dataset.clip;
  hide([String(n),clip?"c"+clip:null]);  // fuera de la lista ya, sin esperar a la Mac
  c.style.transition=".25s";c.style.opacity="0";c.style.transform="scale(.96)";
  setTimeout(()=>{c.remove();const left=document.querySelectorAll("#aprobar .card[data-clip]").length;badge(left);
    if(!left)$("#aprobar").innerHTML='<div class="empty">Todo revisado ✓</div>';},260);
  try{await call(`/api/issue/${n}/${a}`,{method:"POST"});toast(a==="reject"?"Descartado":"Aprobado ✓ Se programa solo a su mejor hora");}
  catch(e){toast("Guardado; se envía en cuanto la Mac responda");pending_acts(n,a);}
}
function playInline(el,v,fb){const box=el.closest(".card").querySelector(".prev");
  if(box.innerHTML){box.querySelectorAll("video").forEach(x=>x.pause());box.innerHTML="";return;}
  document.querySelectorAll("#aprobar .prev video").forEach(x=>{x.pause();x.closest(".prev").innerHTML="";});
  const poster=(el.querySelector("img")||{}).src||"";
  // el video ligero de la Mac (video/mp4, arranca rápido y se adelanta); si no responde, la copia pública
  box.innerHTML=`<video ${poster?`poster="${poster}"`:""} controls playsinline autoplay preload="auto" style="width:100%;margin-top:10px;border-radius:12px;background:#000;aspect-ratio:9/16"></video>`;
  const vid=box.querySelector("video");let alt=fb;
  vid.onerror=()=>{if(alt){const x=alt;alt="";vid.src=x;vid.play().catch(()=>{});}else box.innerHTML='<div class="tiny mut" style="margin-top:8px">El video todavía se está preparando en la Mac. Intenta en un minuto.</div>';};
  vid.onplay=()=>{try{navigator.audioSession&&(navigator.audioSession.type="playback")}catch(e){}};
  vid.src=v||fb;vid.play().catch(()=>{});}
function verPost(el,urls){const box=el.closest(".card").querySelector(".prev");
  if(box.innerHTML){box.innerHTML="";return;}
  box.innerHTML=`<div class="strip" style="margin-top:10px">${urls.map(u=>`<img src="${u}" style="height:auto;width:${urls.length>1?"85%":"100%"};aspect-ratio:4/5" loading="lazy" alt="">`).join("")}</div>`;}
function verImg(img,full){const box=img.closest(".card").querySelector(".prev");
  if(box.dataset.u===full&&box.innerHTML){box.innerHTML="";box.dataset.u="";return;}
  box.dataset.u=full;box.innerHTML=`<img src="${full}" style="width:100%;margin-top:10px;border-radius:12px" alt="" onerror="this.src='${img.src}'">`;}
function verPrev(btn,v,img,poster){const box=btn.closest(".card").querySelector(".prev");if(box.innerHTML){box.querySelectorAll("video").forEach(x=>x.pause());box.innerHTML="";btn.textContent="Ver";return;}
  box.innerHTML=v?`<video src="${v}" ${poster?`poster="${poster}"`:""} controls playsinline autoplay preload="auto" style="width:100%;margin-top:10px;border-radius:12px;background:#000;aspect-ratio:9/16"></video>`:`<img src="${img}" style="width:100%;margin-top:10px;border-radius:12px" alt="">`;btn.textContent="Ocultar";}
async function detener(btn,pkg){if(!confirm("¿Detener este video? No sale en ninguna red y otro toma su lugar."))return;btn.disabled=true;
  try{const r=await call(`/api/detener/${pkg}`,{method:"POST"});toast(r.relleno?"Detenido. Otro video tomó su lugar ✓":"Detenido ✓ El motor pide uno nuevo");VIEWS.aprobar();}
  catch(e){btn.disabled=false;toast("No se pudo detener (¿ya salió?)");}}
async function mark(btn,id,st){btn.disabled=true;try{await call(`/api/guiones/${id}/${st}`,{method:"POST"});toast(st==="recorded"?"¡Bien! Pásalo al álbum MOTOR en Fotos":"Reabierto");VIEWS.grabar();}catch(e){btn.disabled=false;toast("Sin conexión con la Mac");}}
function tp(id){const el=$("#tp");if(!id){el.classList.remove("on");return;}const g=(G.guiones||[]).find(x=>x.id===id);
  $("#tpbody").innerHTML=`<div class="t">GANCHO (A · B · C)</div>${g.ganchos.map(esc).join("<br><br>")}${g.bloques.slice(1).map(b=>`<div class="t">${esc(b.t)}</div>${esc(b.di)}`).join("")}<div class="t">CIERRE</div>${esc(g.cierre)}`;el.classList.add("on");el.scrollTop=0;}
function addRange(){const f=$("#df").value,t=$("#dt").value||f;if(!f){toast("Elige al menos la fecha de inicio");return;}PR.date_ranges.push({from:f<=t?f:t,to:f<=t?t:f,label:$("#dl").value.trim()});savePr();}
function addKw(){const v=$("#kwi").value.trim().toLowerCase();if(!v)return;PR.keywords.push(...v.split(",").map(x=>x.trim()).filter(Boolean));savePr();}
async function savePr(btn){if(btn)btn.disabled=true;try{const r=await call("/api/priorities",{method:"POST",body:JSON.stringify(PR)});toast(`Guardado ✓ ${fmt(r.reordenados)} videos reordenados`);VIEWS.archivo();}catch(e){toast("No se pudo guardar: ¿la Mac está encendida?");if(btn)btn.disabled=false;}}
async function subirVoz(gid,input){
  const f=input.files&&input.files[0];if(!f)return;
  toast("Subiendo tu voz…");
  try{const fd=new FormData();fd.append("audio",f,f.name||"voz.m4a");
    const r=await fetch(API+"/api/voz/"+gid,{method:"POST",headers:{"Authorization":"Bearer "+store.get("key")},body:fd});
    const d=await r.json();toast(r.ok?"✅ "+d.mensaje:"No se pudo: "+(d.detail||r.status));}
  catch(e){toast("Sin conexión con la Mac; intenta en un momento");}
  input.value="";
}
function logout(){store.del("key");show("login");}
async function redeemLink(){
  const m=location.hash.match(/m=([^&]+)/);
  if(m&&!store.get("key")){
    try{const r=await fetch(API+"/api/redeem",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:decodeURIComponent(m[1])})});
      if(r.ok)store.set("key",(await r.json()).key);}catch(e){}
  }
  pinAccess();
}
// Acceso permanente para la app instalada: el iPhone no comparte sesión entre Safari y la pantalla de inicio, así que
// la dirección de inicio de la app lleva la llave de ESTE dispositivo (por el link y por el manifiesto).
function pinAccess(){
  const k=store.get("key");if(!k)return;
  if(k.startsWith("d.")&&!location.search.includes("k=")){  // la dirección siempre lleva la llave (también instalada)
    history.replaceState(null,"",location.pathname+"?k="+encodeURIComponent(k));
  }
}
async function boot(){
  await loadConfig();
  await redeemLink();
  if(!store.get("key")){show("login");return;}
  pinAccess();
  flush_acts();
  let t=store.get("tab");if(!VIEWS[t])t="inicio";show(t);try{await VIEWS[t]();}catch(e){}
  if(t!=="inicio")getData("/api/home").then(d=>badge(d.waiting)).catch(()=>{});
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&store.get("key")){const t=store.get("tab");if(t==="inicio"||t==="aprobar")VIEWS[t]().catch(()=>{});}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script>
