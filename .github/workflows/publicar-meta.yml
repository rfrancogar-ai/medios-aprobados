name: publicar-meta
# Publica en Instagram y Facebook lo aprobado, a su hora, sin depender de ninguna Mac.
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publicar-meta
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre lo más nuevo (una corrida en espera no debe usar una copia vieja)
      - name: Publicar lo que ya toca
        env:
          META_SU_TOKEN: ${{ secrets.META_SU_TOKEN }}
        run: python3 publicar_meta.py
      # publicar_meta.py guarda agenda/hecho.json en main en cuanto algo sale (fusiona, nunca duplica)
