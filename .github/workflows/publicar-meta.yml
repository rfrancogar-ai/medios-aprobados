name: publicar-meta
# Publica en Instagram y Facebook lo aprobado, a su hora, sin depender de ninguna Mac.
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publicar-meta
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Publicar lo que ya toca
        env:
          META_SU_TOKEN: ${{ secrets.META_SU_TOKEN }}
        run: python3 publicar_meta.py
      - name: Guardar resultados
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"
          [ -f agenda/hecho.json ] || exit 0
          git add agenda/hecho.json
          git diff --cached --quiet && exit 0
          git commit -qm "publicado $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
